<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess No</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Number Guessing Game</h2>
        <p>Try and guess a random number between 1 and 100. <br> You have 10 attempts to guess the right number.</p>

        <h1 class="guess">Guess a number</h1>
        <input type="text" class="input" required>
        <button class="btn" id="sbt">Submit guess</button> 
    </div>

    <div class="resultparas">
       <p>Previous Guesses: <span class="guesses"></span></p>
        <p>Guesses Remaining: <span class="lastresult">10</span></p>
        <p class="lowOrHigh"></p>
    </div>


    <script src="app.js"></script>
</body>
</html>
